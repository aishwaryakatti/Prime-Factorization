<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Factorization</title>
    <meta name="description" content="A simple tool to calculate the prime factorization of any composite number.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Prime Factorization</h1>
        <p>Enter a composite number to see its prime factors.</p>
        <div class="input-group">
            <input type="number" id="numberInput" placeholder="Enter a number..." min="2">
            <button id="factorizeBtn">Factorize</button>
        </div>
        <div id="result" class="result-area"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
